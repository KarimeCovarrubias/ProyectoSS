<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña</title>
    <link rel="stylesheet" href="../css/estilo_recuperar.css">
    <script src=""></script>
</head>
<body>
    <main class="rec-caja">
        <h1>¿Olvidaste tu contraseña?</h1>
        <p class="rec-sub">Escribe el correo con el que te registraste y te enviaremos un enlace para crear una nueva.</p>

        <form id="form-olvide" novalidate>
            <label class="rec-campo">Correo
                <input type="email" id="correo" placeholder="26171234@ejemplo.com" autocomplete="email" required>
            </label>
            <p class="rec-msg" id="msg" role="status"></p>
            <button type="submit" class="rec-btn" id="btn">Enviar enlace</button>
        </form>

        <a class="rec-volver" href="../html/login.html">← Volver a iniciar sesión</a>
    </main>
    <script src=""></script>
</body>
</html>
